name: Release

# Push a tag like v0.8.0 to build the ZIPs and publish a GitHub Release.
# The tag must match the version in plugins/*/.claude-plugin/plugin.json.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugins/*/.claude-plugin/plugin.json | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Style check
        run: bash scripts/check-style.sh

      - name: Tests
        run: |
          if [ -f scripts/test.sh ]; then bash scripts/test.sh; fi

      - name: Skill review (fails on any high finding)
        run: |
          python3 scripts/skill_review.py . | tee review.txt
          if grep -q '^\[high\]' review.txt; then
            echo "High findings in skill_review" >&2
            exit 1
          fi

      - name: Build ZIPs
        run: bash scripts/build-zip.sh

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
